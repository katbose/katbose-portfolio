# Generated by scripts/sync-mcp.mjs from .kiro/settings/mcp.json — do not edit by hand.

[mcp_servers.mintlify-admin]
url = "https://mcp.mintlify.com"

[mcp_servers.mintlify-search]
url = "https://mintlify.com/docs/mcp"

[mcp_servers.socket-mcp]
url = "https://mcp.socket.dev/"

[mcp_servers.chrome-devtools]
command = "npx"
args = [
    "-y",
    "chrome-devtools-mcp@1.8.0",
    "--isolated",
    "--no-usage-statistics",
    "--no-performance-crux",
    "--redact-network-headers",
]

[mcp_servers.playwright]
command = "npx"
args = [
    "-y",
    "@playwright/mcp@0.0.79",
    "--isolated",
    "--headless",
    "--browser",
    "chrome",
]

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_KATBOSE"

[mcp_servers.shadcn]
command = "npx"
args = [
    "-y",
    "shadcn@4.21.0",
    "mcp",
]

[mcp_servers.posthog]
url = "https://mcp.posthog.com/mcp"

[mcp_servers.sentry]
url = "https://mcp.sentry.dev/mcp"
