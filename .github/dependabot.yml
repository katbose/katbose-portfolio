version: 2

# Bun dependency updates are intentionally omitted for now. GitHub's hosted
# updater supports bun.lock through format v1, while Bun 1.4.2 writes this
# project's required version-scoped overrides in format v3. Socket continues to
# enforce dependency policy; restore a `bun` entry when Dependabot supports v3.
updates:
  # Preserve immutable action SHAs while opening reviewed update pull requests.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 3
    cooldown:
      # Actions are tags, not semver releases, so the per-bump keys used for the
      # Bun entry are rejected for this ecosystem. One flat window instead.
      default-days: 7
    commit-message:
      prefix: "chore(actions)"
