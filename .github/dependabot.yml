version: 2

# JavaScript dependencies are intentionally not configured here. GitHub's
# hosted Bun updater currently rejects this repository's required bun.lock v3,
# and the npm updater does not maintain Bun lockfiles. Keep Bun upgrades manual
# until the hosted updater supports v3; Socket still enforces dependency policy.
updates:
  # Every external action is pinned to an immutable commit SHA. Dependabot keeps
  # those SHAs and their same-line version comments current without weakening
  # the repository's supply-chain policy.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:30"
      timezone: "Etc/UTC"

    # Wait before adopting newly published action releases. GitHub Actions only
    # supports one flat cooldown; its ecosystem rejects semver-specific keys.
    cooldown:
      default-days: 7

    # Review major action upgrades independently. Combining compatible minor and
    # patch updates reduces PR noise while preserving a human review gate.
    groups:
      actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    # One grouped routine PR plus room for several independent major upgrades.
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
