name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# Squash release PRs with their generated chore(release): vX.Y.Z title.
# Publication also requires the PR branch/body to match the configured release
# identity. A merged PR left with autorelease: pending blocks later releases;
# fail explicitly below if Release Please silently skips publication.

# Never cut two releases at once: a second push while a release PR is being
# reconciled would race on the same manifest and tag.
concurrency:
  group: release
  cancel-in-progress: false

# Wider than CI on purpose, and the reason releases live in their own workflow
# rather than as a job in ci.yml.
permissions:
  # Commit the version bump and changelog, and create the tag and GitHub release.
  contents: write
  # Open and update the release pull request.
  pull-requests: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # googleapis/release-please-action v5.0.0, pinned by SHA so a moved tag
      # cannot change what runs with `contents: write`.
      #
      # There is one version for the entire repository. release-please owns:
      #   - the `version` field in the root package.json (release-type: node)
      #   - apps/docs/changelog.mdx
      #   - the tag, which is exactly vX.Y.Z (include-component-in-tag: false)
      #
      # The workspaces under apps/ and packages/ deliberately declare no
      # `version` field, so there is nothing there for this to drift against.
      #
      # NOTE: this runs with the default GITHUB_TOKEN. GitHub does not trigger
      # workflows from events raised by that token, so CI does not run on the
      # release pull request itself. That is acceptable here because the PR only
      # touches package.json and the changelog, and CI has already passed on the
      # commits being released. Swap in a PAT as `token:` if CI on the release PR
      # is ever wanted.
      - name: Checkout release presentation scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Verify release configuration and presentation
        run: node --test scripts/format-release-notes.test.mjs

      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Detect stalled release publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pending=$(gh pr list --state merged --base main --label 'autorelease: pending' --json number --jq '.[].number')
          if [ -n "$pending" ]; then
            echo "::error::Merged release PRs remain unpublished: $pending. Inspect Release Please warnings."
            exit 1
          fi

      - name: Add release overview
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
          RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          if [ -n "$RELEASE_PR" ]; then
            number=$(printf '%s' "$RELEASE_PR" | jq -r '.number // empty')
            if [ -n "$number" ]; then node scripts/format-release-notes.mjs --pr "$number"; fi
          fi
          if [ "$RELEASE_CREATED" = "true" ]; then
            node scripts/format-release-notes.mjs --release "$RELEASE_TAG"
          fi
